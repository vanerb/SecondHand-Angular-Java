<app-container>
  <div
    style="
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    "
  >
    <div
      style="
        width: 40vh;
        height: 30vh;
        border-top-left-radius: 10px;
        border-bottom-left-radius: 10px;
        overflow: hidden;
      "
    >
      <img
        src="https://material.angular.dev/assets/img/examples/shiba2.jpg"
        alt="Photo of a Shiba Inu"
        style="
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
          display: block;
        "
      />
    </div>

    <div
      style="
        width: 60vh;
        height: 30vh;
        box-sizing: border-box;
        background-color: #ffffff;
        padding: 20px;
        border-top-right-radius: 10px;
        border-bottom-right-radius: 10px;
      "
    >
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
        "
      >
        <div style="text-align: center; width: 100%; color: #012e40">
          <h1 style="margin-top: 0">Registrarse</h1>
        </div>

        <mat-form-field style="width: 100%">
          <mat-label>Email</mat-label>
          <input matInput />
        </mat-form-field>

        <mat-form-field style="width: 100%">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" />
        </mat-form-field>

        <div style="width: 100%; display: flex; justify-content: flex-end">
          <button
            matButton="filled"
            style="display: flex; align-items: center; justify-content: center; gap: 10px"
          >
            Crear cuenta
            <i
              class="bi bi-box-arrow-right"
              style="font-size: 1.25rem; line-height: 1; vertical-align: middle; margin-left: 5px"
            ></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</app-container>
