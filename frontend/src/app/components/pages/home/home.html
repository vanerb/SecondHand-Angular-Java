<main class="marketplace">
  <section class="welcome" aria-labelledby="welcome-title">
    <div class="welcome-copy">
      <span class="eyebrow"
        ><i class="bi bi-stars" aria-hidden="true"></i> SEGUNDA VIDA, NUEVOS DESCUBRIMIENTOS</span
      >
      <h1 id="welcome-title">Lo bueno de antes,<br /><span>te espera ahora.</span></h1>
      <p>Encuentra piezas únicas y dales una nueva historia. Comprar mejor empieza aquí.</p>
      <a class="hero-cta" href="#descubrir"
        >Explorar artículos <i class="bi bi-arrow-down-right" aria-hidden="true"></i
      ></a>
      <div class="community-proof">
        <div class="avatar-stack" aria-hidden="true">
          <span>M</span><span>L</span><span>A</span>
        </div>
        <span><strong>Una comunidad que comparte</strong><br />Miles de hallazgos cada día</span>
      </div>
    </div>
    <div class="welcome-art" role="img" aria-label="Selección de prendas y objetos de segunda mano">
      <span class="art-note note-top"
        ><i class="bi bi-recycle" aria-hidden="true"></i> Comprar con sentido</span
      >
      <span class="art-note note-bottom"
        >Pequeños tesoros, grandes historias <i class="bi bi-heart-fill" aria-hidden="true"></i
      ></span>
    </div>
    <div class="hero-orb orb-one" aria-hidden="true"></div>
    <div class="hero-orb orb-two" aria-hidden="true"></div>
  </section>

 <app-products [isHome]="true"></app-products>
</main>
