<button
  class="category-chip"
  [class.selected]="activeCategory() === category().value"
  (click)="selectCategory(category().value)"
  [attr.aria-pressed]="activeCategory() === category().value"
>
  <i class="bi {{ category().icon }}" aria-hidden="true"></i>

  <span>
    {{ category().name }}
  </span>
</button>
